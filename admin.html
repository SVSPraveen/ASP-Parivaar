<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - ASP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="images/logo.png">
    
    <script src="js/config.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

    <div id="login-screen" class="fixed inset-0 bg-gray-900 flex items-center justify-center z-50 px-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm text-center">
            <div class="bg-gray-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-lock text-gray-600 text-2xl"></i>
            </div>
            <h2 class="text-2xl font-bold mb-2">Admin Access</h2>
            <p class="text-gray-500 mb-6 text-sm">Enter security PIN to continue</p>
            
            <input type="password" id="pin" oninput="document.getElementById('error').classList.add('hidden')" onkeydown="if(event.key==='Enter') checkLogin()" class="w-full p-3 border border-gray-300 rounded-lg mb-4 text-center text-2xl tracking-widest focus:ring-2 focus:ring-gray-800 outline-none" placeholder="••••" maxlength="10">
            
            <button onclick="checkLogin()" class="w-full bg-gray-900 hover:bg-black text-white font-bold py-3 rounded-lg transition">
                Unlock Dashboard
            </button>
            <p id="error" class="text-red-500 text-sm mt-4 font-bold hidden">Incorrect PIN</p>
        </div>
    </div>

    <div id="dashboard" class="hidden min-h-screen">
        
        <header class="bg-white shadow-sm sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <img src="images/logo.png" class="h-8 w-auto">
                    <h1 class="font-bold text-lg hidden sm:block">Admin Dashboard</h1>
                </div>
                <button onclick="logout()" class="text-red-600 hover:bg-red-50 px-4 py-2 rounded-lg text-sm font-bold transition">
                    <i class="fas fa-sign-out-alt mr-2"></i> Logout
                </button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-8">
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-green-500">
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Total Donations</p>
                    <h3 class="text-2xl font-bold text-gray-800 mt-1" id="stat-donations">-</h3>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-blue-500">
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Volunteers</p>
                    <h3 class="text-2xl font-bold text-gray-800 mt-1" id="stat-volunteers">-</h3>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-orange-500">
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Messages</p>
                    <h3 class="text-2xl font-bold text-gray-800 mt-1" id="stat-messages">-</h3>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm overflow-hidden min-h-[500px]">
                <div class="flex border-b border-gray-100 overflow-x-auto">
                    <button onclick="loadTab('donations')" id="tab-donations" class="flex-1 py-4 px-6 font-bold text-sm uppercase tracking-wide border-b-2 border-transparent hover:bg-gray-50 transition whitespace-nowrap text-green-600 border-green-600 bg-green-50">
                        Donations
                    </button>
                    <button onclick="loadTab('volunteers')" id="tab-volunteers" class="flex-1 py-4 px-6 font-bold text-sm uppercase tracking-wide border-b-2 border-transparent hover:bg-gray-50 transition whitespace-nowrap text-gray-500">
                        Volunteers
                    </button>
                    <button onclick="loadTab('messages')" id="tab-messages" class="flex-1 py-4 px-6 font-bold text-sm uppercase tracking-wide border-b-2 border-transparent hover:bg-gray-50 transition whitespace-nowrap text-gray-500">
                        Messages
                    </button>
                </div>

                <div id="content" class="overflow-x-auto">
                    <div class="p-12 text-center text-gray-400">
                        <i class="fas fa-circle-notch fa-spin text-3xl mb-4"></i><br>Loading secure data...
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // XSS Sanitization helper
        function escapeHtml(str) {
            if (str === null || str === undefined) return '-';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // AUTHENTICATION & SESSION
        async function checkLogin() {
            const pinInput = document.getElementById('pin');
            const pin = pinInput.value.trim();
            const errElem = document.getElementById('error');

            if (!pin) {
                errElem.innerText = 'Please enter PIN';
                errElem.classList.remove('hidden');
                return;
            }

            try {
                // Verify PIN against backend donations endpoint
                const res = await fetch(`${CONFIG.API_URL}/api/donations/history`, {
                    headers: {
                        'x-admin-pin': pin,
                        'Authorization': `Bearer ${pin}`
                    }
                });

                if (res.ok) {
                    sessionStorage.setItem('admin_pin', pin);
                    errElem.classList.add('hidden');
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    loadTab('donations');
                } else if (res.status === 401) {
                    errElem.innerText = 'Incorrect PIN';
                    errElem.classList.remove('hidden');
                } else {
                    errElem.innerText = `Server error (${res.status})`;
                    errElem.classList.remove('hidden');
                }
            } catch (networkErr) {
                // Offline / simulation fallback for development
                if (pin === "asp2025") {
                    sessionStorage.setItem('admin_pin', pin);
                    errElem.classList.add('hidden');
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    loadTab('donations');
                } else {
                    errElem.innerText = 'Connection error & invalid PIN';
                    errElem.classList.remove('hidden');
                }
            }
        }

        function logout() {
            sessionStorage.removeItem('admin_pin');
            location.reload();
        }

        // Check existing session on load
        window.addEventListener('DOMContentLoaded', () => {
            const savedPin = sessionStorage.getItem('admin_pin');
            if (savedPin) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                loadTab('donations');
            }
        });

        // TAB SWITCHING
        function updateTabStyles(activeType) {
            ['donations', 'volunteers', 'messages'].forEach(type => {
                const btn = document.getElementById(`tab-${type}`);
                if(type === activeType) {
                    btn.className = "flex-1 py-4 px-6 font-bold text-sm uppercase tracking-wide border-b-2 border-green-600 bg-green-50 text-green-800 transition whitespace-nowrap";
                } else {
                    btn.className = "flex-1 py-4 px-6 font-bold text-sm uppercase tracking-wide border-b-2 border-transparent hover:bg-gray-50 text-gray-500 transition whitespace-nowrap";
                }
            });
        }

        // DATA LOADING
        async function loadTab(type) {
            updateTabStyles(type);
            const content = document.getElementById('content');
            content.innerHTML = '<div class="p-12 text-center text-gray-400"><i class="fas fa-circle-notch fa-spin text-3xl mb-4"></i><br>Fetching latest records...</div>';

            let url = "";
            if(type === 'donations') url = `${CONFIG.API_URL}/api/donations/history`;
            if(type === 'volunteers') url = `${CONFIG.API_URL}/api/volunteer/all`;
            if(type === 'messages') url = `${CONFIG.API_URL}/api/contact/all`;

            const pin = sessionStorage.getItem('admin_pin') || "";
            if (!pin) {
                document.getElementById('dashboard').classList.add('hidden');
                document.getElementById('login-screen').classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch(url, {
                    headers: {
                        'x-admin-pin': pin,
                        'Authorization': `Bearer ${pin}`
                    }
                });
                
                if (res.status === 401) {
                    sessionStorage.removeItem('admin_pin');
                    document.getElementById('dashboard').classList.add('hidden');
                    document.getElementById('login-screen').classList.remove('hidden');
                    document.getElementById('error').innerText = 'Session expired. Please log in again.';
                    document.getElementById('error').classList.remove('hidden');
                    return;
                }

                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}: ${res.statusText}`);
                }

                const json = await res.json();
                const data = (json && Array.isArray(json.data)) ? json.data : [];

                // Update Stat Counter dynamically
                const statElem = document.getElementById(`stat-${type}`);
                if (statElem) statElem.innerText = data.length;

                if(data.length === 0) {
                    content.innerHTML = '<div class="p-12 text-center text-gray-400">No records found.</div>';
                    return;
                }

                // BUILD TABLE WITH SANITIZED DATA (PROTECTS AGAINST STORED XSS)
                let html = `<table class="w-full text-left border-collapse min-w-[700px]">
                    <thead class="bg-gray-50 text-xs uppercase text-gray-500 font-bold tracking-wider"><tr>`;

                if(type === 'donations') html += `<th class="p-5">Date</th><th class="p-5">Donor</th><th class="p-5">Amount</th><th class="p-5">Source</th><th class="p-5">Status</th><th class="p-5">Txn ID</th>`;
                if(type === 'volunteers') html += `<th class="p-5">Name</th><th class="p-5">Mobile</th><th class="p-5">Email</th><th class="p-5">City</th><th class="p-5">Message</th>`;
                if(type === 'messages') html += `<th class="p-5">Name</th><th class="p-5">Email</th><th class="p-5">Subject</th><th class="p-5">Message</th>`;
                
                html += `</tr></thead><tbody class="divide-y divide-gray-100 bg-white">`;

                data.forEach(row => {
                    html += `<tr class="hover:bg-gray-50 transition">`;
                    
                    if(type === 'donations') {
                        const statusColor = row.paymentStatus === 'Verified' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800';
                        const displayDate = row.date ? new Date(row.date).toLocaleDateString() : '-';
                        html += `
                            <td class="p-5 text-sm text-gray-500">${escapeHtml(displayDate)}</td>
                            <td class="p-5 font-bold text-gray-800">${escapeHtml(row.fullName)}</td>
                            <td class="p-5 font-bold text-green-600">₹${escapeHtml(row.amount || 0)}</td>
                            <td class="p-5 text-sm text-gray-500">${escapeHtml(row.source)}</td>
                            <td class="p-5"><span class="px-2 py-1 rounded text-xs font-bold ${statusColor}">${escapeHtml(row.paymentStatus || 'Pending')}</span></td>
                            <td class="p-5 text-xs font-mono text-gray-400">${escapeHtml(row.transactionId)}</td>
                        `;
                    }
                    if(type === 'volunteers') {
                        html += `
                            <td class="p-5 font-bold text-gray-800">${escapeHtml(row.fullName)}</td>
                            <td class="p-5 text-gray-600">${escapeHtml(row.mobile)}</td>
                            <td class="p-5 text-gray-500 text-sm">${escapeHtml(row.email)}</td>
                            <td class="p-5 text-gray-600">${escapeHtml(row.address)}</td>
                            <td class="p-5 text-sm text-gray-500 max-w-xs truncate" title="${escapeHtml(row.message)}">${escapeHtml(row.message)}</td>
                        `;
                    }
                    if(type === 'messages') {
                        html += `
                            <td class="p-5 font-bold text-gray-800">${escapeHtml(row.fullName)}</td>
                            <td class="p-5 text-blue-600 text-sm">${escapeHtml(row.email)}</td>
                            <td class="p-5 text-gray-800 font-medium">${escapeHtml(row.subject)}</td>
                            <td class="p-5 text-sm text-gray-500 max-w-xs truncate" title="${escapeHtml(row.message)}">${escapeHtml(row.message)}</td>
                        `;
                    }

                    html += `</tr>`;
                });

                html += `</tbody></table>`;
                content.innerHTML = html;

            } catch(e) {
                console.error(e);
                content.innerHTML = '<div class="p-12 text-center text-red-500 font-bold"><i class="fas fa-exclamation-triangle mb-2"></i><br>Connection Error. Is Backend Live?</div>';
            }
        }
    </script>
</body>
</html>
